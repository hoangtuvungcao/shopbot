name = "shop-bot-panel"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# Tạo database:  npx wrangler d1 create shopbot
# rồi dán database_id vào bên dưới.
[[d1_databases]]
binding = "DB"
database_name = "shopbot"
database_id = "REPLACE_WITH_D1_ID"

# Tạo bucket ảnh:  npx wrangler r2 bucket create shopbot-images
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shopbot-images"

# ADMIN_PASSWORD và SESSION_SECRET đặt bằng secret trên dashboard
# (Settings > Variables and Secrets), KHÔNG ghi vào file này.
